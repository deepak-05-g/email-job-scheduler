name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: email_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @email-scheduler/db run db:generate

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript workspaces
        run: pnpm typecheck

      - name: Build production packages
        run: pnpm build

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/email_scheduler?schema=public
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: test-session-secret-32-chars-long-abcdef
          NODE_ENV: test
        run: pnpm test
